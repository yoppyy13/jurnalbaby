<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Aktivitas Bayi</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    .susu-group { display: none; background: #f9f9f9; padding: 10px; border-radius: 5px; }
    button { background: #4CAF50; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Input Aktivitas Bayi</h2>
  <form id="babyForm">
    <div class="form-group">
      <label>Tanggal:</label>
      <input type="date" id="tanggal" required>
    </div>

    <div class="form-group">
      <label>Jam Mulai:</label>
      <input type="time" id="jamMulai" required>
    </div>

    <div class="form-group">
      <label>Jam Selesai:</label>
      <input type="time" id="jamSelesai">
    </div>

    <div class="form-group">
      <label>Nama Aktivitas:</label>
      <select id="namaAktivitas" onchange="toggleSusuFields()" required>
        <option value="">-- Pilih Aktivitas --</option>
        <option value="Minum Susu">Minum Susu</option>
        <option value="Tidur">Tidur</option>
        <option value="Ganti Popok">Ganti Popok</option>
        <option value="Bermain">Bermain</option>
        <option value="Mandi">Mandi</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </div>

    <!-- Group Khusus Minum Susu -->
    <div id="susuFields" class="susu-group">
      <div class="form-group">
        <label>Jumlah Susu (ml):</label>
        <input type="number" id="jumlahSusu" placeholder="Contoh: 120">
      </div>
      <div class="form-group">
        <label>Sumber Susu:</label>
        <select id="sumberSusu">
          <option value="">-- Pilih Sumber --</option>
          <option value="DBF (Direct Breastfeeding)">DBF / Menyusu Langsung</option>
          <option value="ASIP (Susu Perah)">ASIP (Susu Perah)</option>
          <option value="Susu Formula">Susu Formula</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Kondisi Bayi:</label>
      <select id="kondisiBayi" required>
        <option value="Ceria">Ceria / Senang</option>
        <option value="Tenang">Tenang</option>
        <option value="Rewel">Rewel</option>
        <option value="Mengantuk">Mengantuk</option>
        <option value="Sakit">Sakit / Demam</option>
      </select>
    </div>

    <div class="form-group">
      <label>Detail Aktivitas / Catatan:</label>
      <textarea id="detailAktivitas" rows="3" placeholder="Catatan tambahan..."></textarea>
    </div>

    <button type="submit">Simpan Aktivitas</button>
  </form>

  <script>
    // Set tanggal hari ini secara otomatis
    document.getElementById('tanggal').valueAsDate = new Date();

    // Tampilkan/Sembunyikan field susu
    function toggleSusuFields() {
      const me = document.getElementById('namaAktivitas').value;
      const susuDiv = document.getElementById('susuFields');
      susuDiv.style.display = (me === 'Minum Susu') ? 'block' : 'none';
    }

    // Kirim Data ke Google Apps Script
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyOY7pveGnCJ1i1ldz-4cKwNu4-nAvQl_NFEJe2PmavQKZVge1nW7r_hPHgvQqu9QxNUg/exec';
    document.getElementById('babyForm').addEventListener('submit', e => {
      e.preventDefault();
      
      const payload = {
        tanggal: document.getElementById('tanggal').value,
        jamMulai: document.getElementById('jamMulai').value,
        jamSelesai: document.getElementById('jamSelesai').value,
        namaAktivitas: document.getElementById('namaAktivitas').value,
        detailAktivitas: document.getElementById('detailAktivitas').value,
        jumlahSusu: document.getElementById('jumlahSusu').value,
        sumberSusu: document.getElementById('sumberSusu').value,
        kondisiBayi: document.getElementById('kondisiBayi').value
      };

      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => {
        alert('Aktivitas berhasil dicatat!');
        document.getElementById('babyForm').reset();
        document.getElementById('tanggal').valueAsDate = new Date();
        toggleSusuFields();
      })
      .catch(err => alert('Gagal menyimpan data: ' + err.message));
    });
  </script>
</body>
</html>
