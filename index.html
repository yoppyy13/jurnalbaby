<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Aktivitas Bayi</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; }
    .card { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    input[readonly] { background-color: #e9ecef; color: #495057; cursor: not-allowed; }
    button { width: 100%; background-color: #4CAF50; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #45a049; }
    .status-msg { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Catat Aktivitas Bayi</h2>
    
    <form id="babyForm">
      <div class="form-group">
        <label for="tanggal">Tanggal:</label>
        <input type="date" id="tanggal" name="tanggal" required>
      </div>

      <div class="form-group">
        <label for="jamMulai">Jam Mulai:</label>
        <input type="time" id="jamMulai" name="jamMulai" onchange="hitungDurasi()" required>
      </div>

      <div class="form-group">
        <label for="jamSelesai">Jam Selesai (Opsional):</label>
        <input type="time" id="jamSelesai" name="jamSelesai" onchange="hitungDurasi()">
      </div>

      <div class="form-group">
        <label for="durasi">Durasi Aktivitas:</label>
        <input type="text" id="durasi" name="durasi" placeholder="Otomatis terhitung..." readonly>
      </div>

      <div class="form-group">
        <label for="namaAktivitas">Jenis Aktivitas:</label>
        <select id="namaAktivitas" name="namaAktivitas" onchange="toggleSusuFields()" required>
          <option value="">-- Pilih Aktivitas --</option>
          <option value="Minum Susu">Minum Susu</option>
          <option value="Tidur">Tidur</option>
          <option value="Ganti Popok">Ganti Popok</option>
          <option value="Mandi">Mandi</option>
          <option value="Main / Tummy Time">Main / Tummy Time</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>

      <!-- Field Khusus Minum Susu -->
      <div id="susuFields" style="display: none;">
        <div class="form-group">
          <label for="jumlahSusu">Jumlah Susu (ml):</label>
          <input type="number" id="jumlahSusu" name="jumlahSusu" placeholder="Contoh: 90">
        </div>

        <div class="form-group">
          <label for="sumberSusu">Sumber Susu:</label>
          <select id="sumberSusu" name="sumberSusu">
            <option value="">-- Pilih Sumber --</option>
            <option value="DBF">DBF (Direct Breastfeeding)</option>
            <option value="ASIP">ASIP (Apusan / Botol)</option>
            <option value="Susu Formula">Susu Formula</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="kondisiBayi">Kondisi / Suasana Hati Bayi:</label>
        <select id="kondisiBayi" name="kondisiBayi">
          <option value="">-- Pilih Kondisi --</option>
          <option value="Tenang / Senang">Tenang / Senang</option>
          <option value="Rewel / Menangis">Rewel / Menangis</option>
          <option value="Mengantuk">Mengantuk</option>
        </select>
      </div>

      <div class="form-group">
        <label for="detailAktivitas">Catatan Tambahan:</label>
        <textarea id="detailAktivitas" name="detailAktivitas" rows="3" placeholder="Catatan opsional..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Simpan Aktivitas</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxHVD-XSTlHwkxxaSdbMNhKQa8uYq46XKJ3Gs5DEpFLon9Gv1CzG0npijrItkQym6DQHw/exec';

    window.addEventListener('DOMContentLoaded', () => {
      resetDateTime();
    });

    function resetDateTime() {
      const now = new Date();
      document.getElementById('tanggal').valueAsDate = now;
      const jam = String(now.getHours()).padStart(2, '0');
      const menit = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('jamMulai').value = `${jam}:${menit}`;
      document.getElementById('jamSelesai').value = '';
      document.getElementById('durasi').value = '';
    }

    function toggleSusuFields() {
      const me = document.getElementById('namaAktivitas').value;
      const isSusu = (me === 'Minum Susu');
      document.getElementById('susuFields').style.display = isSusu ? 'block' : 'none';
      
      // Jika bukan Minum Susu, atur nilainya jadi kosong agar nanti terkirim sebagai "-"
      if (!isSusu) {
        document.getElementById('jumlahSusu').value = '';
        document.getElementById('sumberSusu').value = '';
      }
    }

    function hitungDurasi() {
      const jamMulaiVal = document.getElementById('jamMulai').value;
      const jamSelesaiVal = document.getElementById('jamSelesai').value;
      const durasiInput = document.getElementById('durasi');

      if (!jamMulaiVal || !jamSelesaiVal) {
        durasiInput.value = '';
        return;
      }

      const [h1, m1] = jamMulaiVal.split(':').map(Number);
      const [h2, m2] = jamSelesaiVal.split(':').map(Number);

      let menitMulai = h1 * 60 + m1;
      let menitSelesai = h2 * 60 + m2;

      if (menitSelesai < menitMulai) {
        menitSelesai += 24 * 60;
      }

      const selisihMenit = menitSelesai - menitMulai;
      const jam = Math.floor(selisihMenit / 60);
      const menit = selisihMenit % 60;

      let teksDurasi = '';
      if (jam > 0) teksDurasi += `${jam} jam `;
      if (menit > 0 || jam === 0) teksDurasi += `${menit} menit`;

      durasiInput.value = teksDurasi.trim();
    }

    document.getElementById('babyForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Menyimpan...';
      statusMsg.innerText = '';

      // Fungsi bantu untuk mengganti nilai kosong dengan "-"
      const getValueOrDash = (id) => {
        const val = document.getElementById(id).value.trim();
        return val !== '' ? val : '-';
      };

      const isSusu = document.getElementById('namaAktivitas').value === 'Minum Susu';

      const formData = {
        tanggal: getValueOrDash('tanggal'),
        jamMulai: getValueOrDash('jamMulai'),
        jamSelesai: getValueOrDash('jamSelesai'),
        durasi: getValueOrDash('durasi'),
        namaAktivitas: getValueOrDash('namaAktivitas'),
        jumlahSusu: isSusu ? getValueOrDash('jumlahSusu') : '-',
        sumberSusu: isSusu ? getValueOrDash('sumberSusu') : '-',
        kondisiBayi: getValueOrDash('kondisiBayi'),
        detailAktivitas: getValueOrDash('detailAktivitas')
      };

      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify(formData)
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          statusMsg.style.color = 'green';
          statusMsg.innerText = 'Data berhasil disimpan!';
          document.getElementById('babyForm').reset();
          resetDateTime();
          toggleSusuFields();
        } else {
          throw new Error(data.message || 'Gagal menyimpan');
        }
      })
      .catch(error => {
        console.error('Error:', error);
        statusMsg.style.color = 'red';
        statusMsg.innerText = 'Gagal menyimpan data. Coba lagi.';
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Simpan Aktivitas';
      });
    });
  </script>
</body>
</html>
